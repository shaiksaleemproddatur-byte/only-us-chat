<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Only Us — Private Chat</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#182438;--line:#2b3b52;--muted:#9aabc1;--accent:#9b8cff;--mine:#6556bd;--theirs:#263951}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#101827,#1b2036);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f6fb;min-height:100vh;display:grid;place-items:center;padding:16px}
.app{width:min(100%,560px);height:min(850px,calc(100dvh - 32px));min-height:520px;background:rgba(24,36,56,.96);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px #0007}
header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:12px;color:#9ee6bb}
main{flex:1;min-height:0;display:flex;flex-direction:column}.login{margin:auto;width:min(100% - 40px,360px)}.login h2{font-size:23px;margin:0 0 8px}.login p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 22px}
label{display:block;font-size:13px;color:#c5d0df;margin:14px 0 7px}input{width:100%;border:1px solid var(--line);background:#101a2a;color:#fff;border-radius:12px;padding:14px;font:inherit;outline:none}input:focus{border-color:var(--accent)}
button{border:0;border-radius:12px;padding:13px 16px;font:600 15px system-ui;cursor:pointer;background:var(--accent);color:#111126}button:disabled{opacity:.5;cursor:wait}.login button{width:100%;margin-top:20px}
#error{color:#ffaaaa;font-size:13px;min-height:20px;margin-top:12px}
#chat{display:none;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px}.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.msg{max-width:82%;padding:11px 13px;border-radius:17px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}.msg.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:5px}.msg.theirs{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:5px}.meta{font-size:10px;opacity:.72;margin-top:5px}
.composer{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);padding-bottom:max(13px,env(safe-area-inset-bottom))}.composer input{flex:1;min-width:0}.composer button{padding-inline:18px}
footer{font-size:11px;color:var(--muted);text-align:center;padding:9px 12px;border-top:1px solid var(--line)}
@media(max-width:420px){body{padding:0}.app{height:100dvh;min-height:0;border:0;border-radius:0}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Only Us ♡</h1><div class="sub">A private two-person chat</div></div><div id="status" class="status">● Offline</div></header>
<main>
<section id="login" class="login">
<h2>Welcome</h2><p>Sign in with your assigned username and password.</p>
<form id="loginForm">
<label for="username">Username</label><input id="username" autocomplete="username" autocapitalize="none" required>
<label for="password">Password</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Open chat</button><div id="error" role="alert"></div>
</form></section>
<section id="chat">
<div id="messages" class="messages"><div class="empty">Your conversation starts here ♡</div></div>
<form id="sendForm" class="composer"><input id="messageInput" placeholder="Write a message…" maxlength="2000" autocomplete="off" required><button id="sendBtn" type="submit">Send</button></form>
</section>
</main>
<footer>Only the two authorized accounts can enter.</footer>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDsG9IuSuM1yZ6Bl_It84YKp5Mj15VIhUk",
  authDomain: "shiya-with-shaik.firebaseapp.com",
  databaseURL: "https://shiya-with-shaik-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shiya-with-shaik",
  storageBucket: "shiya-with-shaik.firebasestorage.app",
  messagingSenderId: "848953810855",
  appId: "1:848953810855:web:1086ffa4ee895d63bda082",
  measurementId: "G-5CN0JKG2LE"
};
const accounts = {
  saleem: {email:"saleem@onlyus-chat.invalid", display:"Arshiya"},
  arshiya: {email:"arshiya@onlyus-chat.invalid", display:"Saleem"}
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
let currentUser = "", stopListening = null, sessionStartedAt = Date.now();

function showError(message){ $("error").textContent = message; }
function addMessage(data){
  if (!data || typeof data.text !== "string" || !data.createdAt || data.createdAt < sessionStartedAt) return;
  const empty = $("messages").querySelector(".empty"); if(empty) empty.remove();
  const item = document.createElement("div");
  item.className = "msg " + (data.sender === currentUser ? "mine" : "theirs");
  const body = document.createElement("div"); body.textContent = data.text;
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = (data.sender === currentUser ? "You" : accounts[data.sender]?.display || "Partner") + " · " + new Date(data.createdAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  item.append(body,meta); $("messages").append(item); $("messages").scrollTop = $("messages").scrollHeight;
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); showError("");
  const username = $("username").value.trim().toLowerCase(), password = $("password").value;
  if(!accounts[username]) return showError("Username or password is incorrect.");
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, accounts[username].email, password);
    currentUser = username; sessionStartedAt = Date.now();
    $("login").style.display = "none"; $("chat").style.display = "flex";
    $("status").textContent = "● Connected";
    $("messages").innerHTML = '<div class="empty">Your conversation starts here ♡</div>';
    stopListening = onChildAdded(ref(db,"messages"), snap => addMessage(snap.val()), err => {
      $("status").textContent = "● Connection issue"; console.error(err);
    });
  } catch(err) { showError("Username or password is incorrect. Please try again."); }
  finally { $("loginBtn").disabled = false; }
});
$("sendForm").addEventListener("submit", async e => {
  e.preventDefault(); const text = $("messageInput").value.trim(); if(!text || !currentUser) return;
  $("sendBtn").disabled = true;
  try {
    await push(ref(db,"messages"), {sender:currentUser,text,createdAt:serverTimestamp()});
    $("messageInput").value = ""; $("messageInput").focus();
  } catch(err) { alert("Message could not be sent. Check your internet connection."); }
  finally { $("sendBtn").disabled = false; }
});
window.addEventListener("beforeunload", () => { if(stopListening) stopListening(); });
</script>
</body>
</html>
